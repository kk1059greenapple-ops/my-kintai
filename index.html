<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Attendance System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <div class="clock-container animate-fade">
        <div id="clock-time" class="clock-time">00:00:00</div>
        <div id="clock-date" class="clock-date">2026年5月2日 (土)</div>
    </div>

    <!-- Employee View -->
    <div id="employee-view" class="container animate-fade">
        <header>
            <h1>勤怠管理システム</h1>
            <p class="subtitle">今日も一日頑張りましょう。</p>
        </header>
        <div id="employee-grid" class="employee-grid"></div>
        <div style="margin-top: 3rem; text-align: center;">
            <button id="goto-admin" class="btn btn-out" style="max-width: 200px; margin: 0 auto;">社長管理ページへ</button>
        </div>
    </div>

    <!-- Admin Login View -->
    <div id="admin-login-view" class="container hidden animate-fade">
        <div class="admin-login">
            <h1>管理者ログイン</h1>
            <p class="subtitle">パスワードを入力してください</p>
            <input type="password" id="admin-password" class="input-field" placeholder="Password">
            <button id="login-btn" class="btn btn-in">ログイン</button>
            <button id="back-to-main-from-login" class="btn btn-out" style="margin-top: 1rem;">戻る</button>
        </div>
    </div>

    <!-- Admin Dashboard View -->
    <div id="admin-dashboard-view" class="container hidden animate-fade" style="max-width: 1200px;">
        <nav class="admin-nav">
            <h1>社長管理パネル</h1>
            <button id="logout-btn" class="btn btn-out" style="max-width: 120px;">ログアウト</button>
        </nav>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-bottom: 3rem;">
            <section>
                <h2>従業員の新規追加</h2>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <input type="text" id="new-employee-name" class="input-field" placeholder="名前を入力" style="margin-bottom: 0;">
                    <button id="add-employee-btn" class="btn btn-in" style="max-width: 120px;">追加</button>
                </div>
            </section>
            <section>
                <h2>管理パスワードの変更</h2>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <input type="password" id="new-admin-password" class="input-field" placeholder="新しいパスワード" style="margin-bottom: 0;">
                    <button id="change-pw-btn" class="btn btn-out" style="max-width: 120px;">変更</button>
                </div>
            </section>
        </div>

        <section style="background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 16px; margin-bottom: 3rem;">
            <h2>勤怠記録の修正・追加</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem;">
                <select id="manual-employee-select" class="input-field" style="flex: 1; min-width: 150px; margin:0;"></select>
                <select id="manual-type-select" class="input-field" style="width: 100px; margin:0;">
                    <option value="出勤">出勤</option>
                    <option value="退勤">退勤</option>
                </select>
                <input type="datetime-local" id="manual-datetime" class="input-field" style="flex: 1; min-width: 200px; margin:0;">
                <div style="display: flex; gap: 0.5rem; flex: 1; min-width: 200px;">
                    <button id="add-manual-log-btn" class="btn btn-in">記録を追加</button>
                    <button id="cancel-edit-btn" class="btn btn-out hidden" style="border-color: #666; color: #999;">中止</button>
                </div>
            </div>
        </section>

        <section style="margin-bottom: 3rem;">
            <h2>今月の勤務集計</h2>
            <div style="overflow-x: auto;">
                <table class="report-table">
                    <thead>
                        <tr><th>名前</th><th>状態</th><th>日数</th><th>最終打刻</th><th>操作</th></tr>
                    </thead>
                    <tbody id="admin-report-body"></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2>打刻記録（削除・修正可能）</h2>
            <div style="overflow-x: auto; max-height: 400px; border: 1px solid var(--glass-border); border-radius: 12px;">
                <table class="report-table">
                    <thead>
                        <tr><th>日時</th><th>従業員</th><th>種別</th><th>操作</th></tr>
                    </thead>
                    <tbody id="admin-log-list-body"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
